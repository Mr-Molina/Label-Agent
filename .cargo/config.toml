# Cargo Configuration for Label-Agent
# Target profile: Native dev & Libre Computer AML-S905X-CC (ARM Cortex-A53 / aarch64)

[build]
# Default build options
# Uncomment target to default all builds to Le Potato cross-compilation:
# target = "aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
# Cross-compilation configuration for Libre Computer AML-S905X-CC "Le Potato"
# SoC: Amlogic S905X (4x Cortex-A53, ARMv8-A, 64-bit)
# Host Target OS: Debian GNU/Linux 13.7 (trixie) aarch64
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "target-cpu=cortex-a53",
]
