# Cargo Configuration for Label-Agent
# Target profile: Native development & Raspberry Pi 3 Model B+ (ARM Cortex-A53 / aarch64)

[build]
# Default build options
# Uncomment target to default all builds to Raspberry Pi 3B+ cross-compilation:
# target = "aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
# Cross-compilation configuration for Raspberry Pi 3 Model B+
# SoC: Broadcom BCM2837B0 (4x Cortex-A53, ARMv8-A, 64-bit)
# Host Target OS: Debian GNU/Linux 13.6 (trixie) aarch64
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "target-cpu=cortex-a53",
]
