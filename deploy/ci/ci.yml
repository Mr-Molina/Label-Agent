name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Code Formatting (Google Rust Style)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Formatting (rustfmt)
        run: cargo fmt --all -- --check

  lint-and-test:
    name: Lint, Test, and Host Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Check (All Targets)
        run: cargo check --workspace --all-targets

      - name: Workspace Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit and Integration Tests
        run: cargo test --workspace --all-targets

  cross-check:
    name: ARM64 Cross-Compilation Check (Libre Computer Le Potato AML-S905X-CC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace for ARM64 Target
        run: cargo check --workspace --target aarch64-unknown-linux-gnu
